[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-ai"
version = "0.1.0"
description = "A universal AI model router with provider abstraction, automatic failover, telemetry, and benchmarking."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "DMJ Labs" }
]
keywords = [
    "ai",
    "llm",
    "model-router",
    "ai-router",
    "llm-router",
    "failover",
    "multi-provider"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0"
]

[project.urls]
Repository = "https://github.com/durveshjadhav/relay"
Issues = "https://github.com/durveshjadhav/relay/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "providers*",
    "router*",
    "schemas*",
    "telemetry*",
    "config*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true